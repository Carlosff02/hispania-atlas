services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hispania_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hispania_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./hispania-backend-spring
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hispania_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: c2lhbmlkZWZhdWx0aHNhY3JldC1iYXNlNjQtOWY1YTI1N2M1ZTg5ODc4ZjBmNzVkY2M5YzU2NzQ=
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
       context: ./hispania-atlas-ng
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
