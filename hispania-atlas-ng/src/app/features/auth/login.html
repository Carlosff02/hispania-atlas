<div
  class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 bg-vicblue-dark"
>
  <div
    class="w-full max-w-md bg-vicblue border border-brass/40 rounded-sm shadow-[0_8px_24px_rgba(0,0,0,0.45)]"
  >
    <div class="px-8 pt-8 pb-2 text-center">
      <h1
        class="font-display text-2xl tracking-[0.15em] uppercase text-brass-light font-bold"
      >
        Hispania
      </h1>
      <p class="mt-1 text-[11px] tracking-[0.25em] uppercase text-paper-dark italic">
        Acceso al atlas
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()" class="px-8 py-6 space-y-5" novalidate>
      <div>
        <label
          for="login-username"
          class="block text-[11px] tracking-[0.2em] uppercase text-paper-dark mb-1.5"
          >Usuario</label
        >
        <input
          id="login-username"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="tu_usuario"
          class="w-full px-3 py-2.5 bg-vicblue-dark border text-paper-light text-sm placeholder:text-paper-dark/50 focus:outline-none"
          [ngClass]="controlMarcado('username') ? 'border-red-400' : 'border-brass/30 focus:border-brass'"
          [attr.aria-invalid]="controlMarcado('username')"
          [attr.aria-describedby]="controlMarcado('username') ? 'error-login-username' : null"
        />
        @if (controlMarcado('username')) {
          <p id="error-login-username" class="mt-1 text-[11px] text-red-300">
            Escribe tu nombre de usuario.
          </p>
        }
      </div>

      <div>
        <label
          for="login-password"
          class="block text-[11px] tracking-[0.2em] uppercase text-paper-dark mb-1.5"
          >Contraseña</label
        >
        <div class="relative">
          <input
            id="login-password"
            [type]="verPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full pl-3 pr-20 py-2.5 bg-vicblue-dark border text-paper-light text-sm placeholder:text-paper-dark/50 focus:outline-none"
            [ngClass]="controlMarcado('password') ? 'border-red-400' : 'border-brass/30 focus:border-brass'"
            [attr.aria-invalid]="controlMarcado('password')"
            [attr.aria-describedby]="controlMarcado('password') ? 'error-login-password' : null"
          />
          <button
            type="button"
            (click)="verPassword.set(!verPassword())"
            [attr.aria-pressed]="verPassword()"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            class="absolute right-2 top-1/2 -translate-y-1/2 px-1.5 py-1 text-[10px] font-bold uppercase tracking-[0.08em] text-paper-dark hover:text-brass-light"
          >
            {{ verPassword() ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        @if (controlMarcado('password')) {
          <p id="error-login-password" class="mt-1 text-[11px] text-red-300">
            Escribe tu contraseña.
          </p>
        }
      </div>

      @if (error()) {
        <p
          class="text-xs text-red-300 border border-red-400/40 bg-red-900/20 rounded-sm px-3 py-2"
          role="alert"
        >
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full py-2.5 bg-brass text-vicblue font-bold text-sm tracking-[0.15em] uppercase rounded-sm hover:bg-brass-light transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>

      <p class="text-center text-xs text-paper-dark pt-1">
        ¿Todavía no tienes cuenta?
        <a
          routerLink="/cuenta/crear"
          class="text-brass-light hover:underline font-semibold"
          >Crear una</a
        >
      </p>
    </form>
  </div>
</div>
