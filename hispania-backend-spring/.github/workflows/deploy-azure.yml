name: Deploy Backend to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hispania-backend
  ACR_NAME: hispaniaacr
  IMAGE_NAME: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image to ACR
        uses: azure/docker-build-push@v1
        with:
          context: .
          push: true
          image-name: ${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:latest
